<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p5.js 작품 모음 - 유용선</title>
    
    <style>
        /* ======================== 폰트 및 기본 설정 ======================== */
        :root {
            --primary-color: #34495e; 
            --secondary-color: #ecf0f1; 
            --accent-color: #e74c3c; 
            --text-color: #2c3e50; 
        }

        body {
            background-color: var(--secondary-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            color: var(--text-color);
            min-height: 100vh;
        }

        /* ======================== 헤더 스타일 ======================== */
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px 20px; /* 패딩을 줄여 공간 확보 */
            margin-bottom: 0; /* 작품 영역에 붙도록 마진 제거 */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); 
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.8em; /* 글씨 크기 약간 축소 */
            font-weight: 300; 
        }

        header p {
            font-size: 0.9em;
            opacity: 0.8; 
            margin-bottom: 0;
        }

        /* ======================== 작품 목록 (4분할 임베딩 레이아웃) ======================== */
        #projects {
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            grid-template-rows: repeat(2, 1fr);
            
            gap: 1px; /* 항목 간 간격을 아주 좁게 */
            width: 100vw; /* 뷰포트 전체 너비 사용 */
            /* 헤더 높이를 제외하고 나머지 뷰포트 높이를 차지하도록 계산 */
            height: calc(100vh - 78px); 
            margin: 0; 
        }

        .project {
            background-color: white;
            border: 1px solid #ddd; /* 구분선 */
            box-sizing: border-box;
            overflow: hidden;
            position: relative; /* overlay 위치 지정을 위해 필수 */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* iFrame 스타일: 각 분할 영역을 가득 채우도록 설정 */
        .project iframe {
            width: 100%;
            height: 100%;
            border: none; 
            display: block;
            /* 스크롤바가 생기는 것을 방지 */
            overflow: hidden;
        }
        
        /* 작품 번호 및 제목 (Overlay) 스타일 */
        .overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 5px 10px;
            background-color: rgba(0, 0, 0, 0.6); /* 반투명 배경 */
            color: white;
            font-size: 14px;
            border-radius: 3px;
            z-index: 10; /* 작품 위에 표시되도록 */
            font-weight: 600;
        }
    </style>
</head>
<body>
    <header>
        <h1>나의 p5.js 작품 포트폴리오</h1>
        <p>4개의 작품이 아래 화면에 동시에 실행됩니다.</p>
    </header>

    <section id="projects">
    
        <div class="project">
            <iframe src="sample1/index.html" title="1. 정적 추상화 작품"></iframe>
            <div class="overlay">1. 정적 추상화 작품</div>
        </div>
    
        <div class="project">
            <iframe src="sample2/index.html" title="2. 정적 캐리커처"></iframe>
            <div class="overlay">2. 정적 캐리커처</div>
        </div>

        <div class="project">
            <iframe src="sample3/index.html" title="3. 캐리커처 (움직임)"></iframe>
            <div class="overlay">3. 캐리커처 (마우스/키 입력 움직임)</div>
        </div>

        <div class="project">
            <iframe src="sample4/index.html" title="4. 추상화 (움직임)"></iframe>
            <div class="overlay">4. 추상화 (시간 기반 움직임)</div>
        </div>

    </section>
</body>
</html>
